name: Configure cluster

on:
  workflow_dispatch:

concurrency:
  group: configure-cluster-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: 1.15.8
  APP_NAME: terraform_k8s

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run: { working-directory: ./aws }
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform init

      - name: Plan
        id: plan
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode -var="app_name=$APP_NAME"
          code=$?
          set -e
          case $code in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac

      - name: Summary
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.has_changes == 'true'
        with:
          name: tfplan
          path: aws/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: ./aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: aws
      - run: terraform apply tfplan

  ansible:
    runs-on: ubuntu-latest
    needs: [plan, apply]
    if: always() && needs.plan.result == 'success' && needs.apply.result != 'failure'
    env:
      ANSIBLE_FORCE_COLOR: "1"
      ANSIBLE_HOST_KEY_CHECKING: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3     # ← required by the inventory plugin
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache galaxy collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ hashFiles('ansible/requirements.yaml') }}
      - name: Install ansible + collections
        run: |
          pip install 'ansible-core==2.18.*'
          ansible-galaxy install -r ansible/requirements.yaml
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NODE_SSH_KEY }}
      - name: Sanity check inventory
        working-directory: ansible
        run: |
          ansible-inventory --list > inv.json
          test "$(jq '._meta.hostvars | length' inv.json)" -gt 0 || { echo "empty inventory"; exit 1; }
      - name: Wait for nodes
        working-directory: ansible
        run: |
          ansible all -m wait_for_connection \
            -a 'delay=10 sleep=5 timeout=300'
          ansible all -m ping

      - name: Bootstrap Kubernetes
        working-directory: ansible
        run: ansible-playbook site.yml --diff

      - name: Cluster summary
        working-directory: ansible
        run: |
          {
            echo '## Cluster'
            echo '```'
            ansible control_plane -b -m command -a 'kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes,pods -A -o wide'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

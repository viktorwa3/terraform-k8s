---
# No auth block: the controller uses the AWS SDK default credential chain, which on
# EC2 resolves to the node's instance profile via IMDSv2 (hop limit 2 set in Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1

---
# No auth block: the controller uses the AWS SDK default credential chain, which on
# EC2 resolves to the node's instance profile via IMDSv2 (hop limit 3 set in Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  # Re-validate every minute instead of the controller default (~7 min), so the
  # store turns Ready soon after credentials become reachable.
  refreshInterval: 60
  provider:
    aws:
      service: ParameterStore
      region: us-east-1

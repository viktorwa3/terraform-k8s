---
# No auth block: the SDK default chain resolves to the node's instance profile.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  # Re-validate every minute instead of the ~7 min default.
  refreshInterval: 60
  provider:
    aws:
      service: ParameterStore
      region: us-east-1

---
plugin: cloud.terraform.terraform_state
backend_type: cloud
backend_config:
  organization: test132134132432
  workspaces:
    name: light
search_child_modules: true
# Default hostnames have no count index, so worker[0] and [1] would collide.
hostnames:
  - tag:Name
compose:
  ansible_host: public_ip
  ansible_user: "'ansible'"
groups:
  control_plane: tags.Role == 'control-plane'
  workers: tags.Role == 'worker'

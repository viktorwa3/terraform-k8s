---
plugin: cloud.terraform.terraform_state
backend_type: cloud
backend_config:
  organization: test132134132432
  workspaces:
    name: light
search_child_modules: true
# Without this the plugin names hosts "<type>_<name>" with NO count index, so
# aws_instance.worker[0] and [1] would both become "aws_instance_worker" and
# silently overwrite each other. The Name tag is unique per instance.
hostnames:
  - tag:Name
compose:
  ansible_host: public_ip
  ansible_user: "'ansible'"
groups:
  control_plane: tags.Role == 'control-plane'
  workers: tags.Role == 'worker'

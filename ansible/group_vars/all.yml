---
# Minor track for the pkgs.k8s.io apt repo and the apt version pin.
# kubernetesVersion is deliberately NOT set in ClusterConfiguration: kubeadm then
# uses its own binary version, which matches the apt-installed kubelet. Pinning it
# separately produced kubelet 1.36.4 against a 1.36.0 control plane.
k8s_minor: "v1.36"
k8s_apt_version: "1.36.*"

pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

cilium_version: "1.20.2"
helm_version: "v3.19.0"

# Single-node learning cluster: let workloads schedule on the control plane
untaint_control_plane: true

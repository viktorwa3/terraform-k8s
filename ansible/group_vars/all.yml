---
# kubernetesVersion is left unset so kubeadm matches the apt-installed kubelet.
k8s_minor: "v1.36"
k8s_apt_version: "1.36.*"

pod_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"

cilium_version: "1.20.2"
helm_version: "v3.19.0"

# CP takes workloads only while there are no workers.
untaint_control_plane: "{{ groups['workers'] | default([]) | length == 0 }}"

# Ansible only bootstraps Argo CD; the rest comes from git.
argocd_chart_version: "10.9.2"
gitops_repo_url: https://github.com/viktorwa3/terraform-k8s.git
gitops_revision: master
gitops_apps_path: gitops/apps
# root + 5 child apps
gitops_expected_apps: 6

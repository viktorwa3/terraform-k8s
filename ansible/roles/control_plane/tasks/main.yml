---
- name: Check whether the control plane is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Render the kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --skip-phases=addon/kube-proxy
    creates: /etc/kubernetes/admin.conf
  when: not control_plane_admin_conf.stat.exists

- name: Ensure the remote user has a kube config directory
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install the admin kubeconfig for the remote user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Read the current control-plane taints
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes
      -l node-role.kubernetes.io/control-plane
      -o jsonpath={.items[*].spec.taints[*].key}
  register: control_plane_taints
  changed_when: false

- name: Remove the control-plane taint on a single-node cluster
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes
      -l node-role.kubernetes.io/control-plane
      node-role.kubernetes.io/control-plane:NoSchedule-
  changed_when: true
  when:
    - untaint_control_plane | bool
    - "'node-role.kubernetes.io/control-plane' in control_plane_taints.stdout"

- name: Restore the control-plane taint once dedicated workers exist
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes
      -l node-role.kubernetes.io/control-plane
      node-role.kubernetes.io/control-plane:NoSchedule
  changed_when: true
  when:
    - not untaint_control_plane | bool
    - "'node-role.kubernetes.io/control-plane' not in control_plane_taints.stdout"

---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.posix.mount:
    path: "{{ item.mount }}"
    state: absent_from_fstab
  loop: "{{ ansible_mounts | selectattr('fstype', 'equalto', 'swap') | list }}"
  loop_control:
    label: "{{ item.mount }}"

- name: Load kernel modules required by the CRI and CNI
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Apply sysctl settings required by kubeadm
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }
  loop_control:
    label: "{{ item.name }}"

---
# Password never reaches argv, logs or state: IMDS token -> Key Vault REST -> stdin.
- name: Get a Key Vault token from the node identity
  ansible.builtin.uri:
    url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net&client_id={{ azure_node_identity_client_id }}"
    headers:
      Metadata: "true"
    return_content: true
  register: argocd_kv_token
  no_log: true

- name: Read the admin password secret
  ansible.builtin.uri:
    url: "{{ argocd_key_vault_uri }}secrets/{{ argocd_key_vault_secret }}?api-version=7.4"
    headers:
      Authorization: "Bearer {{ argocd_kv_token.json.access_token }}"
    return_content: true
  register: argocd_kv_secret
  no_log: true

- name: Read the current admin password hash
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get secret argocd-secret
      -o jsonpath={.data.admin\.password}
  register: argocd_current_hash
  changed_when: false
  failed_when: false
  no_log: true

- name: Install python3-bcrypt
  ansible.builtin.apt:
    name: python3-bcrypt
    state: present
    update_cache: true
    cache_valid_time: 3600

# bcrypt salt is random, so reuse a matching hash to keep helm idempotent.
- name: Check the current hash against the Key Vault password
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import bcrypt,os,sys;sys.exit(0 if bcrypt.checkpw(sys.stdin.read().encode(),os.environ["H"].encode()) else 1)'
    stdin: "{{ argocd_kv_secret.json.value }}"
    stdin_add_newline: false
  environment:
    H: "{{ argocd_current_hash.stdout | b64decode }}"
  register: argocd_hash_check
  changed_when: false
  failed_when: false
  no_log: true
  when: argocd_current_hash.rc == 0 and argocd_current_hash.stdout | length > 0

- name: Hash the password when the cluster has none or a different one
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import bcrypt,sys;print(bcrypt.hashpw(sys.stdin.read().encode(),bcrypt.gensalt(10)).decode())'
    stdin: "{{ argocd_kv_secret.json.value }}"
    stdin_add_newline: false
  register: argocd_new_hash
  changed_when: false
  no_log: true
  when: argocd_hash_check.rc | default(1) != 0

- name: Pass the hash to the chart
  ansible.builtin.set_fact:
    argocd_extra_values: >-
      {{ argocd_extra_values | combine({'configs': {'secret': {'argocdServerAdminPassword':
      (argocd_new_hash.stdout | trim) if argocd_new_hash is not skipped else (argocd_current_hash.stdout | b64decode)}}},
      recursive=true) }}
  no_log: true

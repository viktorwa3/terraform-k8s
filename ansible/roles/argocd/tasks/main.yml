---
- name: Add the Argo helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Read the admin password from Key Vault
  ansible.builtin.include_tasks: admin_password.yml
  when: argocd_key_vault_uri | length > 0

- name: Serve Argo CD through ingress-nginx with a cert-manager certificate
  ansible.builtin.set_fact:
    argocd_extra_values: >-
      {{ argocd_extra_values | combine({
        'global': {'domain': argocd_ingress_host},
        'server': {'ingress': {
          'enabled': true,
          'ingressClassName': 'nginx',
          'hostname': argocd_ingress_host,
          'tls': true,
          'annotations': {'cert-manager.io/cluster-issuer': 'letsencrypt'}}}},
        recursive=true) }}
  when: argocd_ingress_host | length > 0

- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    timeout: 10m
    values: "{{ argocd_values | combine(argocd_extra_values, recursive=true) }}"
  no_log: true

- name: Render the root app-of-apps
  ansible.builtin.template:
    src: root-app.yaml.j2
    dest: /etc/kubernetes/argocd-root-app.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the root app-of-apps
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /etc/kubernetes/argocd-root-app.yaml
  register: argocd_root_apply
  changed_when: "'unchanged' not in argocd_root_apply.stdout"

- name: Create the Key Vault secret store
  ansible.builtin.include_tasks: secret_store.yml
  when: argocd_key_vault_uri | length > 0

---
# Vault name has a random suffix per RG, so the store cannot live in git.
- name: Wait for the External Secrets CRD
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig /etc/kubernetes/admin.conf wait
      --for=condition=Established crd/clustersecretstores.external-secrets.io --timeout=10s
  register: argocd_eso_crd
  changed_when: false
  retries: 60
  delay: 10
  until: argocd_eso_crd.rc == 0

- name: Render the ClusterSecretStore
  ansible.builtin.template:
    src: cluster-secret-store.yaml.j2
    dest: /etc/kubernetes/azure-cluster-secret-store.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the ClusterSecretStore
  ansible.builtin.command:
    cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f /etc/kubernetes/azure-cluster-secret-store.yaml
  register: argocd_secret_store_apply
  changed_when: "'unchanged' not in argocd_secret_store_apply.stdout"

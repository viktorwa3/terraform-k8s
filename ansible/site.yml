---
- name: Prepare every node
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    - role: containerd
      tags: [containerd]
    - role: kube_tools
      tags: [kube_tools]

- name: Bootstrap the control plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: control_plane
      tags: [control_plane]
    - role: cni_cilium
      tags: [cni]

- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: worker
      tags: [worker]

- name: Bootstrap GitOps
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - role: argocd
      tags: [argocd]

- name: Verify the cluster
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Wait for every node to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
          nodes --all --timeout=300s
      changed_when: false

    - name: Wait for every kube-system pod to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
          pods --all -n kube-system --timeout=300s
      changed_when: false

    # The root app is Healthy only when every child Application is Healthy (Lua
    # health check in argocd-cm), so this single wait covers ESO, the secret store,
    # the ExternalSecret and kube-prometheus-stack.
    - name: Wait for GitOps to converge
      block:
        # async + poll: the runner reconnects every 15 s instead of holding one silent
        # SSH session open for up to 15 minutes (see ssh_connection in ansible.cfg).
        - name: Wait for the root Application to become Healthy
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd wait application/root
              --for=jsonpath={.status.health.status}=Healthy --timeout=900s
          async: 960
          poll: 15
          changed_when: false
      rescue:
        - name: Collect Argo CD application status
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get applications
              -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,MESSAGE:.status.conditions[*].message
          register: gitops_apps
          changed_when: false
          failed_when: false

        - name: Collect External Secrets status
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf get clustersecretstore,externalsecret -A
          register: gitops_eso
          changed_when: false
          failed_when: false

        - name: Fail with the GitOps state
          ansible.builtin.fail:
            msg: "{{ gitops_apps.stdout_lines + [''] + gitops_eso.stdout_lines + [gitops_eso.stderr | default('')] }}"

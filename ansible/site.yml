---
- name: Prepare every node
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common]
    - role: containerd
      tags: [containerd]
    - role: kube_tools
      tags: [kube_tools]

- name: Bootstrap the control plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - role: control_plane
      tags: [control_plane]
    - role: cni_cilium
      tags: [cni]

- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: worker
      tags: [worker]

- name: Bootstrap GitOps
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - role: argocd
      tags: [argocd]

- name: Verify the cluster
  hosts: control_plane
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Wait for every node to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
          nodes --all --timeout=300s
      changed_when: false

    - name: Wait for every kube-system pod to become Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready
          pods --all -n kube-system --timeout=300s
      changed_when: false

    # Poll instead of one long silent `kubectl wait`:
    #  - every attempt is a short SSH call, so idle-TCP drops on the runner can't hang it
    #  - "FAILED - RETRYING ... (N retries left)" in the log shows the job is alive
    #  - the last attempt's table (name / sync / health per app) is kept for the rescue
    # Healthy alone is not enough: while an app's first sync is still running (e.g. only
    # its PreSync hook Job exists yet) Argo reports it Healthy. So the last operation must
    # also have Succeeded. Sync status is not required (drift can be benign).
    - name: Wait for GitOps to converge
      block:
        - name: Wait until every Argo CD application is Healthy
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get applications --no-headers
              -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,OP:.status.operationState.phase
          register: gitops_apps
          changed_when: false
          retries: 60
          delay: 15
          until:
            - gitops_apps.rc == 0
            - gitops_apps.stdout_lines | length >= gitops_expected_apps
            - gitops_apps.stdout_lines | reject('search', '\\sHealthy\\s+Succeeded\\s*$') | list | length == 0
      rescue:
        - name: Collect Argo CD application conditions
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf -n argocd get applications
              -o custom-columns=NAME:.metadata.name,HEALTH:.status.health.status,OP:.status.operationState.phase,MSG:.status.conditions[*].message
          register: gitops_conditions
          changed_when: false
          failed_when: false

        - name: Collect External Secrets and workload status
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig /etc/kubernetes/admin.conf get
              clustersecretstore,externalsecret,pods -A --field-selector=metadata.namespace!=kube-system
          register: gitops_eso
          changed_when: false
          failed_when: false

        - name: Fail with the GitOps state
          ansible.builtin.fail:
            msg: "{{ gitops_conditions.stdout_lines + [''] + gitops_eso.stdout_lines + [gitops_eso.stderr | default('')] }}"

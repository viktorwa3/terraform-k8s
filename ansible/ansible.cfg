[defaults]
inventory = inventory/terraform_state.yaml
host_key_checking = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
# GitHub-hosted runners sit behind Azure SNAT, which silently drops TCP flows that
# stay idle for ~4 minutes. A long, silent remote command (kubectl wait, helm --wait)
# then never returns its result and Ansible hangs forever. Keepalives keep the flow warm.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10

[defaults]
inventory = inventory/terraform_state.yaml
host_key_checking = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
# Runners drop idle TCP after ~4 min; keepalives stop silent hangs.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
